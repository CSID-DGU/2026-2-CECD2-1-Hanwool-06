limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;   # 응답 헤더·오류 페이지에서 nginx 버전 숨김(2026-10-31 사이버안전센터 지적)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    # 허용한 IP에서만 접속(2026-10-31 사이버안전센터 지적). 목록은 서버의 /etc/nginx/water-allow.conf에만 둔다(공개 레포에 올리지 않음). 나머지는 403
    include /etc/nginx/water-allow.conf;
    deny all;

    ssl_certificate     /etc/letsencrypt/live/water-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/water-ip/privkey.pem;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
